<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">let-agent-plan — resolve the decisions before coding</title>
  <desc id="description">Interactive planning for Claude Code and OpenCode v2: research your project, decide together, and leave with a Markdown plan. Planning only, not implementation.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#10121d"/>
  <rect x="1" y="1" width="1278" height="638" rx="24" fill="none" stroke="#303347" stroke-width="2"/>
  <rect x="64" y="56" width="52" height="52" rx="13" fill="url(#brand)"/>
  <path d="m78 83 9 9 16-19" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="134" y="94" fill="#f5f5ff" font-size="36" font-weight="700">let-agent-plan</text>
    <text x="1216" y="90" fill="#b8b7cb" font-size="22" text-anchor="end">Planning, not implementation.</text>

    <text x="64" y="220" fill="#f5f5ff" font-size="74" font-weight="700">Resolve the decisions.</text>
    <text x="64" y="310" fill="#c4b5fd" font-size="74" font-weight="700">Then let your agent build.</text>
    <text x="68" y="366" fill="#c6c8da" font-size="29">Better questions. Fewer assumptions. A plan you can build.</text>

    <rect x="64" y="403" width="187" height="44" rx="22" fill="#232537" stroke="#45415d"/>
    <text x="157" y="432" fill="#f5f5ff" font-size="22" text-anchor="middle">Claude Code</text>
    <rect x="263" y="403" width="198" height="44" rx="22" fill="#232537" stroke="#45415d"/>
    <text x="362" y="432" fill="#f5f5ff" font-size="22" text-anchor="middle">OpenCode v2</text>

    <path d="M64 484H1216" stroke="#303347" stroke-width="2"/>
    <text x="64" y="534" fill="#c4b5fd" font-size="24" font-weight="700">01</text>
    <text x="110" y="534" fill="#f5f5ff" font-size="24">Research your project</text>
    <path d="m408 521 10 8-10 8" fill="none" stroke="#73778e" stroke-width="2"/>
    <text x="464" y="534" fill="#c4b5fd" font-size="24" font-weight="700">02</text>
    <text x="510" y="534" fill="#f5f5ff" font-size="24">Decide together</text>
    <path d="m808 521 10 8-10 8" fill="none" stroke="#73778e" stroke-width="2"/>
    <text x="864" y="534" fill="#c4b5fd" font-size="24" font-weight="700">03</text>
    <text x="910" y="534" fill="#f5f5ff" font-size="24">Get a Markdown plan</text>
    <text x="64" y="594" fill="#9297af" font-size="21">github.com/furkankaynak/let-agent-plan</text>
    <text x="1216" y="594" fill="#9297af" font-size="21" text-anchor="end">Open source · MIT</text>
  </g>
</svg>
